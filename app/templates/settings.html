{% extends "base.html" %}
{% block title %}Settings — ShortBridge{% endblock %}
{% block content %}
<h1>Settings</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" action="/settings" class="settings-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label>Daily times (HH:MM, comma-separated)
        <input type="text" name="daily_times" value="{{ schedule.daily_times }}" placeholder="10:00,15:00,20:00">
    </label>

    <label>Timezone
        <input type="text" name="timezone" value="{{ schedule.timezone }}">
    </label>

    <fieldset>
        <legend>Active days</legend>
        {% for day in ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"] %}
        <label class="inline">
            <input type="checkbox" name="{{ day }}" {% if schedule[day] %}checked{% endif %}>
            {{ day|capitalize }}
        </label>
        {% endfor %}
    </fieldset>

    <button type="submit">Save</button>
</form>
{% endblock %}
